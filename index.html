<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
    <script src="script.js" defer></script>
    <script src="array.js" defer></script>
    <script src="templates.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
</head>

<body>
    <header>
        <div class="header-img">
            <img src="./assets/logo/Logo 02.png" alt="BestellApp-logo">
        </div>
    </header>

    <main>
        <div class="landing-container">

            <div class="hero-wrapper">
                <img class="hero-img" src="./assets/img/hero.png" alt="Pizza-and-Burgers-image">
                <div class="burger-logo">
                    <img src="./assets/logo/main-logo.png" alt="Burger-Logo">
                </div>
            </div>

            <div class="landing-description">
                <div class="rating-box">
                    <img src="./assets/logo/star.png" alt="Star-Logo">
                    <p><b>4,1</b></p>
                    <p class="rating-count">(317)</p>
                </div>
                <div class="description-box">
                    <h1><span>Burger</span>House</h1>
                    <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
                </div>
            </div>
        </div>
    </main>


    <footer></footer>
</body>

</html>
