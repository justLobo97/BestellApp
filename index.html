<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
    <script src="./JS/array.js" defer></script>
    <script src="./JS/templates.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./CSS/fonts.css">
    <link rel="stylesheet" href="./CSS/dialog.css">
</head>

<body onload="renderBasket()">
    <header>
        <div class="header-img">
            <img src="./assets/logo/Logo 02.png" alt="BestellApp-logo">
        </div>
    </header>

    <main>

        <div class="landing-container">

            <div class="hero-wrapper">
                <img class="hero-img" src="./assets/img/hero.png" alt="Pizza-and-Burgers-image">
                <div class="burger-logo">
                    <img src="./assets/logo/main-logo.png" alt="Burger-Logo">
                </div>
            </div>

            <div class="landing-description">
                <div class="rating-box">
                    <img src="./assets/logo/star.png" alt="Star-Logo">
                    <p><b>4,1</b></p>
                    <p class="rating-count">(317)</p>
                </div>
                <div class="description-box">
                    <h1><span>Burger</span>House</h1>
                    <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
                </div>
            </div>

        </div>

        <div class="menu-section">
            <div class="menu-wrapper" id="menu-wrapper">
            </div>
        </div>

    </main>

    <footer>
        <div class="footer-container">
            <p>Imprint</p>
            <p>Cookie Preferences</p>
            <p>© 2026 BurgerHouse</p>
        </div>

        <div class="mobile-bar">
            <a href="index.html">
                <img src="./assets/logo/Home.png" alt="Home-Icon">
            </a>
            <a href="">
                <img src="./assets/logo/Profile.png" alt="Profile-Icon">
            </a>
            <a href="">
                <img src="./assets/logo/orders.png" alt="Orders-Icon">
            </a>
            <a id="basket-button" class="basket-button" onclick="openBasket()">
                <img id="basket-icon" class="basket-icon" src="./assets/logo/basket.png" alt="Basket-Icon">
                <span class="basket-count" id="basket-count"></span>
            </a>
        </div>
    </footer>

    <dialog class="basket-dialog" id="basket-dialog">

        <button class="x-button" onclick="closeDialog(basketDialog)">
            <img src="./assets/logo/close.png" alt="Close-Icon">
        </button>

        <h3>Your Basket</h3>

        <div class="basket-container" id="basket-container">
            <div class="basket-scroll">
                <div class="basket-items" id="basket-items">
                </div>
            </div>

            <div class="basket-summary" id="basket-summary">
                <div class="price">
                    <p>Subtotal</p>
                    <p id="subtotal"></p>
                </div>

                <div class="deliver-fee">
                    <p>Delivery fee (free over 20€)</p>
                    <p id="deliver-fee"></p>
                </div>

                <div class="total-price">
                    <p>Total</p>
                    <p id="total-price"></p>
                </div>

                <button class="buy-now" id="buy-now" onclick="openOrderDialog()"></button>
            </div>
        </div>

    </dialog>

    <dialog class="order-confirmed-dialog" id="order-confirmed-dialog">
        <button onclick="closeOrderDialog()" class="order-confirmed-close-button"><img src="./assets/logo/close.png" alt="Close-Icon"></button>
        <div class="delivery-content">
            <img src="./assets/logo/deliver.png" alt="Deliver-Car-Icon">
            <h4>Order confirmed!</h4>
            <p>Your food is on the way!</p>
        </div>
    </dialog>

</body>

</html>
